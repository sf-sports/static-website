<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SF Sports is launching soon." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="SF Sports | Launching Soon" />
    <meta property="og:description" content="SF Sports is launching soon." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sfsports.in/" />
    <meta property="og:image" content="https://sfsports.in/assets/sfsports-logo.png" />
    <title>SF Sports | Launching Soon</title>
    <link rel="icon" href="assets/sfsports-logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="domain" href="#top" aria-label="SF Sports home">sfsports.in</a>

        <p class="status" aria-label="Website status: launching soon">
          <span class="status-dot" aria-hidden="true"></span>
          Launching soon
        </p>
      </header>

      <main id="top" class="hero">
        <div class="logo-panel">
          <img
            class="brand-logo"
            src="assets/sfsports-logo.png"
            alt="SF Sports"
            width="1536"
            height="1536"
          />
        </div>

        <div class="launch-copy">
          <p class="eyebrow">SF / 01</p>
          <h1>Launching<br />soon.</h1>
          <div class="copy-footer">
            <span class="copy-line" aria-hidden="true"></span>
            <p>Stay tuned.</p>
          </div>
        </div>
      </main>

      <footer class="site-footer">
        <p>&copy; <span id="year"></span> SF Sports</p>
        <p>India</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
